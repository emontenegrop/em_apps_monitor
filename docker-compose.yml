services:

  # ── PostgreSQL (con TimescaleDB opcional) ──────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: em_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       em_monitor
      POSTGRES_USER:     em_monitor
      POSTGRES_PASSWORD: em_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U em_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Rust backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .                        # workspace root — contiene Cargo.toml + backend/
      dockerfile: backend/Dockerfile
    container_name: em_monitor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:             postgres://em_monitor:em_monitor@postgres:5432/em_monitor
      SERVER_ADDR:              0.0.0.0:3000
      COLLECTION_INTERVAL_SECS: 15
      METRICS_RETENTION_DAYS:   7
      RUST_LOG:                 em_monitor=debug,tower_http=info
      # Administrador inicial: solo se usa si la BD no tiene usuarios (ver .env.example)
      ADMIN_USERNAME:           ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:           ${ADMIN_PASSWORD:-}
      # URL que se muestra en el comando de instalación de los agentes
      PUBLIC_URL:               ${PUBLIC_URL:-https://172.16.27.31:8443}
      AGENT_CA_FILE:            /etc/em-monitor/ca.crt
    ports:
      - "3000:3000"
    volumes:
      # Socket de Docker del host para monitorear contenedores locales
      - /var/run/docker.sock:/var/run/docker.sock
      # CA interna (solo el certificado público) que se entrega a los agentes al inscribirse
      - ./pki/ca/ca.crt:/etc/em-monitor/ca.crt:ro
    group_add:
      - "${DOCKER_GID:-999}"

  # ── React frontend (nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: em_monitor_ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # Certificado del central emitido por la CA interna: ./pki/em-pki.sh server central <SAN...>
      - ./pki/issued/central.crt:/etc/nginx/certs/server.crt:ro
      - ./pki/issued/central.key:/etc/nginx/certs/server.key:ro
      # Instalador y binarios del agente: ./agent/build-release.sh
      - ./dist/agent:/usr/share/nginx/agent:ro

  # ── Agente para el host del propio central (opcional) ────────────────────
  # 1. Genera una ficha en la UI y copia la huella de la CA.
  # 2. docker compose --profile agent run --rm agent enroll --url https://frontend --token FICHA --ca-fingerprint HUELLA
  # 3. docker compose --profile agent up -d agent
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: em_monitor_agent
    restart: unless-stopped
    depends_on:
      - frontend
    # Ver los procesos del host (no los del contenedor)
    pid: host
    environment:
      # Discos del host montado en /host
      EM_AGENT_HOST_ROOT: /host
    volumes:
      - agent_config:/etc/em-agent
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro

volumes:
  postgres_data:
  agent_config:
