# HTTP: solo redirige a HTTPS. La sesión usa una cookie `Secure` y los agentes
# exigen TLS, así que nada se sirve en claro.
# 8443 es el puerto publicado en docker-compose.yml para el 443 del contenedor.
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    # TLS con certificado emitido por la CA interna (pki/em-pki.sh)
    listen 443 ssl;
    http2  on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY always;
    add_header Referrer-Policy        same-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Instalador y binarios del agente (agent/build-release.sh → dist/agent)
    location ^~ /agent/ {
        alias /usr/share/nginx/agent/;
        default_type application/octet-stream;
        types { text/plain sh; }
    }

    # Agentes remotos: inscripción, CA y WebSocket
    location /api/agent/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        client_max_body_size 4m;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # WebSocket
    location /ws {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
