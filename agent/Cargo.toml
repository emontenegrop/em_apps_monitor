[package]
name = "em_agent"
version = "0.1.0"
edition = "2021"
description = "Agente de EM Monitor: recolecta métricas del host y de Docker/Podman"

[[bin]]
name = "em-agent"
path = "src/main.rs"

[dependencies]
em_protocol    = { path = "../crates/protocol" }
tokio          = { version = "1",   features = ["full"] }
bollard        = "0.16"
sysinfo        = "0.30"
futures-util   = "0.3"
serde          = { version = "1",   features = ["derive"] }
serde_json     = "1"
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1",   features = ["v4", "serde"] }
anyhow         = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap           = { version = "4",   features = ["derive", "env"] }
toml           = "0.8"
fastrand       = "2"
thiserror      = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# ring como proveedor criptográfico: compila sin cmake/nasm, también para musl
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# Cliente HTTP bloqueante para `enroll` (rustls 0.23 con ring, igual que el WebSocket)
ureq           = { version = "2", default-features = false, features = ["tls", "json"] }
sha2           = "0.10"
hex            = "0.4"

[target.'cfg(unix)'.dependencies]
libc           = "0.2"
